name: Keepalive

on:
  schedule:
    - cron: "0 12 1 * *"   # 1st of every month, 12:00 UTC
  workflow_dispatch:        # lets you run it manually too

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a keepalive commit
        run: |
          date -u > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%F)"
          git push
